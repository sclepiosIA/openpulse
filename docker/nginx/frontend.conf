# ============================================
# Configuration Nginx pour le conteneur Frontend
# Sert les fichiers statiques React/Vite
# ============================================

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ============================================
    # Compression Gzip
    # ============================================
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types
        application/javascript
        application/json
        application/xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # ============================================
    # Cache des assets statiques
    # ============================================
    
    # Assets avec hash (immutables)
    location ~* \.(?:css|js)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Images et fonts
    location ~* \.(?:jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ============================================
    # SPA Routing
    # Toutes les routes non-fichiers redirigent vers index.html
    # ============================================
    location / {
        try_files $uri $uri/ /index.html;

        # Headers de sécurité
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(self), microphone=(self), camera=(self), payment=(), usb=(), magnetometer=(), gyroscope=()" always;
        # Cross-Origin isolation headers (pentest 2026-05 — findings MEDIUM/INFO)
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-site" always;
        # POLITIQUE DE SECURITE DE CONTENU
        #
        # Elle portait quinze hotes herites de l'editeur d'origine, neutralises
        # en *.example.org : des adresses qui n'existent chez personne. Elles
        # n'autorisaient donc rien, et la liste ne contenait PAS l'origine de
        # l'API de l'adoptant -- l'application se chargeait et n'atteignait
        # jamais son serveur, sans message.
        #
        # REMPLACEZ VOTRE-API par l'origine de votre instance dans connect-src,
        # et ajoutez a frame-src, img-src ou media-src les seules origines que
        # vous joignez reellement. La composition documentee
        # (docker-compose.openpulse.yml) n'utilise PAS ce fichier : elle sert la
        # politique depuis la balise meta d'index.html, construite avec
        # l'origine reelle. Ce fichier vaut pour les trois autres compositions.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://VOTRE-API wss://VOTRE-API; frame-src 'self'; media-src 'self' blob:; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self' tauri://localhost http://tauri.localhost https://tauri.localhost; upgrade-insecure-requests" always;

    }

    # ============================================
    # Health check
    # ============================================
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ============================================
    # Fichiers sensibles
    # ============================================
    location ~ /\. {
        deny all;
    }

    # ============================================
    # Erreurs
    # ============================================
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
