# ============================================
# Nginx Configuration - OpenPulse
# Reverse Proxy pour Frontend + Supabase On-Premise
# ============================================

# Définir les variables d'environnement
# SUPABASE_HOST et SUPABASE_PORT sont passées via docker-compose
env SUPABASE_HOST;
env SUPABASE_PORT;

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Format de log
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # Optimisations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;

    # Compression Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript 
               application/xml application/xml+rss text/javascript application/x-javascript
               image/svg+xml;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

    # Upstream pour le frontend
    upstream frontend {
        server frontend:80;
        keepalive 32;
    }

    # ============================================
    # Serveur HTTP (redirect vers HTTPS en production)
    # ============================================
    server {
        listen 80;
        server_name gestion.exploitant.example.org;

        # Challenge ACME pour Let's Encrypt
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirection vers HTTPS en production
        location / {
            return 301 https://$server_name$request_uri;
        }
    }

    # ============================================
    # Serveur HTTPS (Production)
    # ============================================
    server {
        listen 443 ssl http2;
        server_name gestion.exploitant.example.org;

        # Certificats SSL Let's Encrypt
        ssl_certificate /etc/letsencrypt/live/gestion.exploitant.example.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/gestion.exploitant.example.org/privkey.pem;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets off;

        # Protocoles SSL sécurisés
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        # HSTS (HTTP Strict Transport Security)
        add_header Strict-Transport-Security "max-age=63072000" always;

        # === FRONTEND ===
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # === SUPABASE REST API (PostgREST) ===
        location /rest/v1/ {
            set $supabase_upstream "http://SUPABASE_HOST_PLACEHOLDER:8000";
            proxy_pass $supabase_upstream/rest/v1/;
            
            limit_req zone=api burst=20 nodelay;
            
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header apikey $http_apikey;
            
            # Timeouts pour les requêtes longues
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # === SUPABASE AUTH (GoTrue) ===
        location /auth/v1/ {
            set $supabase_upstream "http://SUPABASE_HOST_PLACEHOLDER:8000";
            proxy_pass $supabase_upstream/auth/v1/;
            
            limit_req zone=auth burst=10 nodelay;
            
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header apikey $http_apikey;
        }

        # === SUPABASE STORAGE ===
        location /storage/v1/ {
            set $supabase_upstream "http://SUPABASE_HOST_PLACEHOLDER:8000";
            proxy_pass $supabase_upstream/storage/v1/;
            
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header apikey $http_apikey;
            
            # Timeout plus long pour les uploads
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            
            # Pas de limite de taille pour les uploads
            client_max_body_size 0;
        }

        # === SUPABASE EDGE FUNCTIONS ===
        location /functions/v1/ {
            set $supabase_upstream "http://SUPABASE_HOST_PLACEHOLDER:8000";
            proxy_pass $supabase_upstream/functions/v1/;
            
            limit_req zone=api burst=30 nodelay;
            
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header apikey $http_apikey;
            
            # Timeout long pour les fonctions IA (GPT-5)
            proxy_connect_timeout 120s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        # === SUPABASE REALTIME (WebSocket) ===
        location /realtime/v1/ {
            set $supabase_upstream "http://SUPABASE_HOST_PLACEHOLDER:8000";
            proxy_pass $supabase_upstream/realtime/v1/;
            
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket keepalive
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # === HEALTH CHECK ===
        location /health {
            access_log off;
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        # === SÉCURITÉ ===
        # Bloquer l'accès aux fichiers cachés
        location ~ /\. {
            deny all;
        }
    }
}
