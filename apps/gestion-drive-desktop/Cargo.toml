[workspace]
resolver = "2"
members = ["src-tauri", "crates/sync-core"]

[workspace.package]
version = "0.1.11"
edition = "2021"
license = "UNLICENSED"
authors = ["GSI"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"

[profile.release]
lto = true
codegen-units = 1
strip = true
