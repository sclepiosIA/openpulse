server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Politique de sécurité du contenu, alignée sur `public/_headers`.
  #
  # Elle manquait ici : le fichier posait quatre en-têtes mais aucune CSP, alors
  # que `frame-ancestors` — la seule directive qui protège réellement contre
  # l'encadrement, et qui prime sur X-Frame-Options — ne peut être servie que
  # par un en-tête HTTP. Le contrat `src/config/csp.contract.test.ts` couvre ce
  # fichier : toute divergence avec les deux autres configurations le rougit.
  #
  # `connect-src` : remplacer VOTRE-API par l'origine de votre passerelle.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://VOTRE-API wss://VOTRE-API; frame-src 'self'; media-src 'self' blob:; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self' tauri://localhost http://tauri.localhost https://tauri.localhost; upgrade-insecure-requests" always;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Permissions-Policy "geolocation=(self), microphone=(self), camera=(self), payment=(), usb=(), magnetometer=(), gyroscope=()" always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location = /readyz {
    access_log off;
    default_type text/plain;
    return 200 "ready\n";
  }

  location = /manifest.webmanifest {
    default_type application/manifest+json;
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
  }

  location = /sw.js {
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location /desktop-downloads/ {
    try_files $uri $uri/ =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
