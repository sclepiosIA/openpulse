name: Backend RLS (pgTAP)

on:
  pull_request:
    branches: [main, master]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - '.github/workflows/backend-rls.yml'
  workflow_dispatch:

jobs:
  pgtap:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: 2.109.1

      - name: Start local Supabase stack
        run: supabase start

      - name: Apply migrations
        run: supabase db reset --no-seed

      - name: Run pgTAP RLS tests
        run: supabase test db

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup
