name: Backend RLS (pgTAP)

on:
  pull_request:
    branches: [main, master]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - '.github/workflows/backend-rls.yml'
  workflow_dispatch:

jobs:
  pgtap:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.109.1

      - name: Start local Supabase stack
        run: supabase start

      - name: Apply migrations
        run: supabase db reset --no-seed

      - name: Run pgTAP RLS tests
        run: supabase test db

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup
