name: Security Audit

on:
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Monday at 9:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Step Security Harden Runner
  harden-runner:
    name: Harden Runner Analysis
    # Exécuteur privé : ce job ne peut pas tourner sur une bifurcation, où
    # aucun exécuteur de ce nom n'existe. Sans cette garde il resterait en
    # attente indéfiniment — un contributeur externe n'y lirait aucune cause.
    # Le dépôt d'origine déclare la variable EXECUTEURS_PRIVES à « oui ».
    if: vars.EXECUTEURS_PRIVES == 'oui'
    runs-on: [self-hosted, large-runner]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
        with:
          egress-policy: audit
          disable-sudo: true

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

  # Secret Scanning with Gitleaks
  gitleaks:
    name: Gitleaks Secret Scan
    # Exécuteur privé : ce job ne peut pas tourner sur une bifurcation, où
    # aucun exécuteur de ce nom n'existe. Sans cette garde il resterait en
    # attente indéfiniment — un contributeur externe n'y lirait aucune cause.
    # Le dépôt d'origine déclare la variable EXECUTEURS_PRIVES à « oui ».
    if: vars.EXECUTEURS_PRIVES == 'oui'
    runs-on: [self-hosted, large-runner]
    needs: harden-runner
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      # A4 (backlog 2026-07-08) — self-hosted macOS: the gitleaks-action installer
      # collides on a shared /tmp/gitleaks.tmp between runs
      # ("Destination file path .../gitleaks.tmp already exists").
      # Isolate TMPDIR per run+job so parallel/successive runs never clash.
      - name: Use isolated temp dir for Gitleaks installer
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks-${GITHUB_RUN_ID}-${GITHUB_JOB}"
          echo "TMPDIR=$RUNNER_TEMP/gitleaks-${GITHUB_RUN_ID}-${GITHUB_JOB}" >> "$GITHUB_ENV"

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_NOTIFY_USER_LIST: '@openpulse-security'

  # Static Application Security Testing with Semgrep
  # A3 (backlog 2026-07-08) — container jobs are unsupported on self-hosted macOS
  # runners ("Container operations are only supported on Linux runners").
  # Run this job on GitHub-hosted ubuntu-latest where the semgrep/semgrep
  # container is supported.
  semgrep:
    name: Semgrep SAST Scan
    runs-on: ubuntu-latest
    needs: harden-runner
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run Semgrep
        run: semgrep scan --config=auto --config=p/security-audit --config=p/typescript --config=p/react --sarif --output=semgrep-results.sarif
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Upload Semgrep results to GitHub Security
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        if: always()
        with:
          sarif_file: semgrep-results.sarif

  # NPM Dependency Audit
  npm-audit:
    name: NPM Security Audit
    # Exécuteur privé : ce job ne peut pas tourner sur une bifurcation, où
    # aucun exécuteur de ce nom n'existe. Sans cette garde il resterait en
    # attente indéfiniment — un contributeur externe n'y lirait aucune cause.
    # Le dépôt d'origine déclare la variable EXECUTEURS_PRIVES à « oui ».
    if: vars.EXECUTEURS_PRIVES == 'oui'
    runs-on: [self-hosted, large-runner]
    needs: harden-runner
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit (high+critical blocking)
        run: npm audit --audit-level=high

  # TypeScript Type Checking
  type-check:
    name: TypeScript Type Check
    # Exécuteur privé : ce job ne peut pas tourner sur une bifurcation, où
    # aucun exécuteur de ce nom n'existe. Sans cette garde il resterait en
    # attente indéfiniment — un contributeur externe n'y lirait aucune cause.
    # Le dépôt d'origine déclare la variable EXECUTEURS_PRIVES à « oui ».
    if: vars.EXECUTEURS_PRIVES == 'oui'
    runs-on: [self-hosted, large-runner]
    timeout-minutes: 40
    needs: harden-runner
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript check
        run: npx tsc --noEmit --incremental
        timeout-minutes: 35
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  # ESLint Security Rules
  eslint-security:
    name: ESLint Security Check
    # Exécuteur privé : ce job ne peut pas tourner sur une bifurcation, où
    # aucun exécuteur de ce nom n'existe. Sans cette garde il resterait en
    # attente indéfiniment — un contributeur externe n'y lirait aucune cause.
    # Le dépôt d'origine déclare la variable EXECUTEURS_PRIVES à « oui ».
    if: vars.EXECUTEURS_PRIVES == 'oui'
    runs-on: [self-hosted, large-runner]
    needs: harden-runner
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint (zero warnings tolerated — SEC-07b)
        run: npm run lint -- --max-warnings=0

  # SBOM Generation (Supply Chain - NIS2/OWASP A02)
  sbom:
    name: SBOM CycloneDX
    # Exécuteur privé : ce job ne peut pas tourner sur une bifurcation, où
    # aucun exécuteur de ce nom n'existe. Sans cette garde il resterait en
    # attente indéfiniment — un contributeur externe n'y lirait aucune cause.
    # Le dépôt d'origine déclare la variable EXECUTEURS_PRIVES à « oui ».
    if: vars.EXECUTEURS_PRIVES == 'oui'
    runs-on: [self-hosted, large-runner]
    needs: harden-runner
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate CycloneDX SBOM
        run: npx @cyclonedx/cyclonedx-npm --output-file sbom.json --output-reproducible

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-cyclonedx
          path: sbom.json
          retention-days: 90

  # Security Summary Job
  security-summary:
    name: Security Summary
    # Exécuteur privé : ce job ne peut pas tourner sur une bifurcation, où
    # aucun exécuteur de ce nom n'existe. Sans cette garde il resterait en
    # attente indéfiniment — un contributeur externe n'y lirait aucune cause.
    # Le dépôt d'origine déclare la variable EXECUTEURS_PRIVES à « oui ».
    # always() est conserve : la synthese doit s'ecrire meme si un controle a
    # echoue. Elle reste toutefois liee a l'executeur prive.
    if: vars.EXECUTEURS_PRIVES == 'oui' && always()
    runs-on: [self-hosted, large-runner]
    needs: [gitleaks, semgrep, npm-audit, type-check, eslint-security, sbom]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
        with:
          egress-policy: audit

      - name: Check job results
        run: |
          echo "## Security Audit Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Gitleaks Secret Scan | ${{ needs.gitleaks.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Semgrep SAST | ${{ needs.semgrep.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| NPM Audit | ${{ needs.npm-audit.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| TypeScript Check | ${{ needs.type-check.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ESLint Security | ${{ needs.eslint-security.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SBOM CycloneDX | ${{ needs.sbom.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY

      - name: Fail if any security gate did not succeed
        if: |
          needs.gitleaks.result != 'success' ||
          needs.semgrep.result != 'success' ||
          needs.npm-audit.result != 'success' ||
          needs.type-check.result != 'success' ||
          needs.eslint-security.result != 'success' ||
          needs.sbom.result != 'success'
        run: |
          echo "::error::One or more required security gates did not succeed!"
          exit 1
